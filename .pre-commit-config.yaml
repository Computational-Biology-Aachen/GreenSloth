default_stages: [pre-commit]
repos:
- repo: local
  hooks:
    - id: no-session-trailer
      name: Block leaked Claude-Session URLs in commit messages
      entry: bash scripts/check-commit-msg.sh
      language: system
      pass_filenames: true
      stages: [commit-msg]
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.9.9
  hooks:
    # Run the linter.
    - id: ruff
      exclude: |
        (?x)^(
          Templates/.*|
          models/unfinished/.*|
          packages/.*
        )$
      types_or: [ python, pyi ]
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
      exclude: |
        (?x)^(
          Templates/.*|
          models/unfinished/.*|
          packages/.*
        )$
      types_or: [ python, pyi ]
